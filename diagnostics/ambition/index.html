<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>야망의 모양 진단 · 어바웃 프리덤</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Serif+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #FDFBF7;
  --bg-deep: #F5F1E8;
  --ink: #1A1916;
  --ink-soft: #4A453E;
  --ink-faint: #8B8478;
  --line: #D4CDBE;
  --accent: #6B5B45;
  --highlight: #B8956A;
  --serif: 'Gowun Batang', 'Noto Serif KR', serif;
  --sans: 'Noto Serif KR', serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--serif);
  font-weight: 400;
  line-height: 1.7;
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
}

/* 종이 질감 */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    radial-gradient(circle at 20% 30%, rgba(184, 149, 106, 0.04) 0%, transparent 50%),
    radial-gradient(circle at 80% 70%, rgba(107, 91, 69, 0.03) 0%, transparent 50%);
  pointer-events: none;
  z-index: 0;
}

body::after {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    repeating-linear-gradient(
      45deg,
      transparent,
      transparent 2px,
      rgba(26, 25, 22, 0.008) 2px,
      rgba(26, 25, 22, 0.008) 4px
    );
  pointer-events: none;
  z-index: 1;
}

.container {
  max-width: 720px;
  margin: 0 auto;
  padding: 60px 32px 120px;
  position: relative;
  z-index: 2;
}

/* === 인트로 === */
.intro {
  text-align: center;
  padding: 80px 0 40px;
  animation: fadeUp 1.2s ease-out;
}

.intro-mark {
  display: inline-block;
  font-size: 11px;
  letter-spacing: 0.4em;
  color: var(--ink-faint);
  margin-bottom: 48px;
  position: relative;
}

.intro-mark::before,
.intro-mark::after {
  content: '';
  position: absolute;
  top: 50%;
  width: 32px;
  height: 1px;
  background: var(--line);
}
.intro-mark::before { right: calc(100% + 16px); }
.intro-mark::after { left: calc(100% + 16px); }

.intro-title {
  font-size: clamp(36px, 6vw, 56px);
  font-weight: 700;
  line-height: 1.3;
  letter-spacing: -0.02em;
  margin-bottom: 32px;
  color: var(--ink);
}

.intro-title .accent {
  color: var(--highlight);
  font-style: italic;
  font-weight: 400;
}

.intro-subtitle {
  font-size: 16px;
  color: var(--ink-soft);
  max-width: 520px;
  margin: 0 auto 64px;
  line-height: 1.9;
}

.intro-meta {
  display: flex;
  justify-content: center;
  gap: 48px;
  margin-bottom: 64px;
  font-size: 13px;
  color: var(--ink-faint);
  letter-spacing: 0.05em;
}

.intro-meta span::before {
  content: '·';
  margin-right: 8px;
  color: var(--highlight);
}

.start-btn {
  background: var(--ink);
  color: var(--bg);
  border: none;
  padding: 20px 48px;
  font-family: var(--serif);
  font-size: 15px;
  font-weight: 400;
  letter-spacing: 0.15em;
  cursor: pointer;
  transition: all 0.4s ease;
  position: relative;
  overflow: hidden;
}

.start-btn::before {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--highlight);
  transform: translateY(100%);
  transition: transform 0.4s ease;
  z-index: 0;
}

.start-btn:hover::before { transform: translateY(0); }
.start-btn span { position: relative; z-index: 1; }

.intro-quote {
  margin-top: 96px;
  padding: 32px 0;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  font-style: italic;
  color: var(--ink-soft);
  font-size: 15px;
  line-height: 2;
}

.intro-quote-author {
  display: block;
  margin-top: 16px;
  font-style: normal;
  font-size: 12px;
  letter-spacing: 0.2em;
  color: var(--ink-faint);
}

/* === 진단 === */
.quiz {
  display: none;
  animation: fadeUp 0.8s ease-out;
}

.quiz.active { display: block; }

.progress-bar {
  position: sticky;
  top: 0;
  background: var(--bg);
  padding: 24px 0;
  z-index: 10;
  margin-bottom: 48px;
  border-bottom: 1px solid var(--line);
}

.progress-info {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 12px;
  font-size: 12px;
  letter-spacing: 0.15em;
  color: var(--ink-faint);
}

.progress-current {
  font-size: 24px;
  font-weight: 700;
  color: var(--ink);
  font-family: var(--serif);
}

.progress-track {
  height: 1px;
  background: var(--line);
  position: relative;
}

.progress-fill {
  position: absolute;
  height: 1px;
  background: var(--ink);
  transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
}

.question-block {
  display: none;
  animation: fadeIn 0.6s ease-out;
}

.question-block.active { display: block; }

.q-section {
  font-size: 11px;
  letter-spacing: 0.3em;
  color: var(--highlight);
  margin-bottom: 24px;
  text-transform: uppercase;
}

.q-text {
  font-size: clamp(22px, 3.5vw, 28px);
  font-weight: 700;
  line-height: 1.5;
  color: var(--ink);
  margin-bottom: 48px;
  letter-spacing: -0.01em;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.option {
  background: transparent;
  border: 1px solid var(--line);
  padding: 24px 28px;
  text-align: left;
  font-family: var(--serif);
  font-size: 16px;
  line-height: 1.6;
  color: var(--ink-soft);
  cursor: pointer;
  transition: all 0.3s ease;
  position: relative;
  width: 100%;
}

.option::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  width: 3px;
  height: 100%;
  background: var(--highlight);
  transform: scaleY(0);
  transform-origin: top;
  transition: transform 0.3s ease;
}

.option:hover {
  background: var(--bg-deep);
  color: var(--ink);
  border-color: var(--ink-soft);
  transform: translateX(4px);
}

.option:hover::before { transform: scaleY(1); }

.option.selected {
  background: var(--ink);
  color: var(--bg);
  border-color: var(--ink);
}

.option.selected::before { transform: scaleY(1); background: var(--bg); }

.nav-buttons {
  display: flex;
  justify-content: space-between;
  margin-top: 64px;
  padding-top: 32px;
  border-top: 1px solid var(--line);
}

.nav-btn {
  background: transparent;
  border: none;
  font-family: var(--serif);
  font-size: 14px;
  letter-spacing: 0.1em;
  color: var(--ink-soft);
  cursor: pointer;
  padding: 12px 0;
  transition: color 0.3s ease;
}

.nav-btn:hover { color: var(--ink); }
.nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }

.nav-btn.next {
  color: var(--ink);
  font-weight: 700;
}

/* === 결과지 === */
.result {
  display: none;
  animation: fadeUp 1.2s ease-out;
}

.result.active { display: block; }

.result-header {
  text-align: center;
  margin-bottom: 64px;
  padding: 48px 0;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}

.result-label {
  font-size: 11px;
  letter-spacing: 0.4em;
  color: var(--ink-faint);
  margin-bottom: 24px;
}

.result-emoji {
  font-size: 48px;
  margin-bottom: 24px;
  display: block;
}

.result-title {
  font-size: clamp(32px, 5vw, 44px);
  font-weight: 700;
  letter-spacing: -0.02em;
  margin-bottom: 16px;
  line-height: 1.3;
}

.result-tagline {
  font-style: italic;
  color: var(--highlight);
  font-size: 18px;
}

/* 두 축 시각화 */
.axis-viz {
  margin: 64px 0;
  padding: 48px 0;
}

.axis-viz-label {
  text-align: center;
  font-size: 11px;
  letter-spacing: 0.3em;
  color: var(--ink-faint);
  margin-bottom: 32px;
}

.axis-grid {
  position: relative;
  width: 100%;
  max-width: 480px;
  height: 320px;
  margin: 0 auto;
  border: 1px solid var(--line);
  background:
    linear-gradient(to right, transparent 49.8%, var(--line) 49.8%, var(--line) 50.2%, transparent 50.2%),
    linear-gradient(to bottom, transparent 49.8%, var(--line) 49.8%, var(--line) 50.2%, transparent 50.2%);
}

.axis-label {
  position: absolute;
  font-size: 11px;
  letter-spacing: 0.2em;
  color: var(--ink-faint);
}

.axis-label.top { top: -28px; left: 50%; transform: translateX(-50%); }
.axis-label.bottom { bottom: -28px; left: 50%; transform: translateX(-50%); }
.axis-label.left { left: -8px; top: 50%; transform: translateX(-100%) translateY(-50%); }
.axis-label.right { right: -8px; top: 50%; transform: translateX(100%) translateY(-50%); }

.axis-dot {
  position: absolute;
  width: 16px;
  height: 16px;
  background: var(--highlight);
  border-radius: 50%;
  transform: translate(-50%, -50%);
  box-shadow: 0 0 0 6px rgba(184, 149, 106, 0.2);
  animation: pulse 2s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 6px rgba(184, 149, 106, 0.2); }
  50% { box-shadow: 0 0 0 12px rgba(184, 149, 106, 0.1); }
}

/* 결과지 본문 */
.result-section {
  margin-bottom: 56px;
}

.result-section-mark {
  display: inline-block;
  font-size: 11px;
  letter-spacing: 0.3em;
  color: var(--highlight);
  margin-bottom: 16px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--highlight);
}

.result-section-title {
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 20px;
  letter-spacing: -0.01em;
}

.result-section-body {
  font-size: 16px;
  line-height: 1.9;
  color: var(--ink-soft);
}

.result-section-body p { margin-bottom: 16px; }

.shadow-box {
  background: var(--bg-deep);
  padding: 32px;
  border-left: 3px solid var(--highlight);
  margin-top: 16px;
}

.next-step {
  background: var(--ink);
  color: var(--bg);
  padding: 48px 32px;
  margin-top: 32px;
  position: relative;
}

.next-step .result-section-mark {
  color: var(--bg-deep);
  border-color: var(--bg-deep);
}

.next-step .result-section-body {
  color: var(--bg-deep);
}

.book-rec {
  display: flex;
  gap: 24px;
  align-items: flex-start;
  padding: 32px;
  background: var(--bg-deep);
  margin-top: 16px;
}

.book-icon {
  font-size: 32px;
  flex-shrink: 0;
}

.book-content { flex: 1; }
.book-title { font-weight: 700; margin-bottom: 4px; font-size: 17px; }
.book-author { font-size: 13px; color: var(--ink-faint); margin-bottom: 12px; letter-spacing: 0.05em; }
.book-reason { font-size: 14px; line-height: 1.8; color: var(--ink-soft); }

/* 클로징 */
.closing {
  text-align: center;
  margin-top: 96px;
  padding-top: 48px;
  border-top: 1px solid var(--line);
}

.closing-text {
  font-style: italic;
  color: var(--ink-soft);
  font-size: 17px;
  line-height: 2;
  max-width: 500px;
  margin: 0 auto 48px;
}

.action-buttons {
  display: flex;
  gap: 16px;
  justify-content: center;
  flex-wrap: wrap;
}

.action-btn {
  background: transparent;
  border: 1px solid var(--ink);
  color: var(--ink);
  padding: 16px 32px;
  font-family: var(--serif);
  font-size: 14px;
  letter-spacing: 0.1em;
  cursor: pointer;
  transition: all 0.3s ease;
}

.action-btn:hover {
  background: var(--ink);
  color: var(--bg);
}

.action-btn.primary {
  background: var(--ink);
  color: var(--bg);
}

.action-btn.primary:hover {
  background: var(--highlight);
  border-color: var(--highlight);
}

/* 애니메이션 */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@media (max-width: 600px) {
  .container { padding: 40px 20px 80px; }
  .intro-meta { flex-direction: column; gap: 12px; }
  .intro-meta span::before { display: none; }
  .option { padding: 20px; font-size: 15px; }
  .axis-grid { height: 280px; }
}
</style>
</head>
<body>

<div class="container">

  <!-- ============ 인트로 ============ -->
  <section class="intro" id="intro">
    <div class="intro-mark">ABOUT FREEDOM · 일상의 깨달음</div>

    <h1 class="intro-title">
      당신의 야망은<br>
      어떤 <span class="accent">모양</span>인가요
    </h1>

    <p class="intro-subtitle">
      야망은 큰 사람과 없는 사람으로 나뉘지 않습니다.<br>
      어떤 연료로 타오르고, 어떤 온도로 흐르는지가 다를 뿐입니다.<br>
      이 진단은 당신 안에 이미 있는 야망의 결을 발견합니다.
    </p>

    <div class="intro-meta">
      <span>12문항</span>
      <span>약 8분</span>
      <span>6가지 유형</span>
    </div>

    <button class="start-btn" onclick="startQuiz()">
      <span>시작하기</span>
    </button>

    <div class="intro-quote">
      "야망이 적은 줄 알았지만,<br>
      사실 가장 조용하게 가장 깊이 흐르고 있었다."
      <span class="intro-quote-author">— FROM A QUIET AMBITION</span>
    </div>
  </section>

  <!-- ============ 진단 ============ -->
  <section class="quiz" id="quiz">
    <div class="progress-bar">
      <div class="progress-info">
        <span><span class="progress-current" id="progressNum">01</span><span style="opacity:0.4"> / 12</span></span>
        <span id="sectionLabel">현재의 나</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill" style="width: 8.33%"></div>
      </div>
    </div>

    <div id="questionContainer"></div>

    <div class="nav-buttons">
      <button class="nav-btn" id="prevBtn" onclick="prevQuestion()">← 이전</button>
      <button class="nav-btn next" id="nextBtn" onclick="nextQuestion()" disabled>다음 →</button>
    </div>
  </section>

  <!-- ============ 결과 ============ -->
  <section class="result" id="result"></section>

</div>

<script>
// ============ 데이터 ============
// 두 축: fuel (ego/duty/joy 누적), intensity (0-100, 높을수록 치열함)
// 각 선택지는 fuel 카테고리에 1점, intensity 점수 부여

const questions = [
  // === SECTION 1: 현재의 나 (Q1-4) ===
  {
    section: '현재의 나',
    text: '"이 정도면 일이 다 끝났다"는 감각은 언제 찾아오나요?',
    options: [
      { text: '남들이 요구한 마감과 기준을 무사히 통과했을 때', fuel: 'duty', intensity: 30 },
      { text: '내 눈에 보이는 작은 거슬림까지 다 손봐서 내 기준을 만족시켰을 때', fuel: 'joy', intensity: 85 },
      { text: '예상보다 좋은 평가나 인정을 받았을 때', fuel: 'ego', intensity: 70 },
      { text: '딱히 명확한 끝을 느끼지 못한다. 그저 다음 일로 넘어간다', fuel: 'duty', intensity: 50 }
    ]
  },
  {
    section: '현재의 나',
    text: '큰 성과를 냈을 때 가장 먼저 드는 생각은?',
    options: [
      { text: '드디어 해냈어. 이제 좀 쉬어도 되겠다', fuel: 'duty', intensity: 40 },
      { text: '다행이다. 다음엔 어떻게 더 매끄럽게 할 수 있을까', fuel: 'joy', intensity: 90 },
      { text: '봤지? 내가 해낼 거라고 했잖아', fuel: 'ego', intensity: 80 },
      { text: '특별한 감흥이 없다. 그냥 다음 할 일을 본다', fuel: 'duty', intensity: 60 }
    ]
  },
  {
    section: '현재의 나',
    text: '주말이나 휴식 시간에 일에 대한 생각이 떠오를 때 당신은',
    options: [
      { text: '의식적으로 차단한다. 쉴 때는 쉬는 게 맞다', fuel: 'joy', intensity: 35 },
      { text: '대수롭지 않게 메모해두고 평일에 처리한다', fuel: 'duty', intensity: 55 },
      { text: '아예 노트북을 열고 그 자리에서 마무리해버린다', fuel: 'duty', intensity: 90 },
      { text: '머릿속으로 자연스럽게 그 문제를 이리저리 굴려본다', fuel: 'joy', intensity: 75 }
    ]
  },
  {
    section: '현재의 나',
    text: '주변에서 "왜 그렇게까지 해?"라는 말을 들을 때 당신은',
    options: [
      { text: '들어본 적이 거의 없다', fuel: 'duty', intensity: 25 },
      { text: '듣긴 했지만 나는 그게 당연한 수준이라고 느낀다', fuel: 'duty', intensity: 85 },
      { text: '그러게, 너무 무리했나 싶다가도 결국 또 그렇게 한다', fuel: 'duty', intensity: 80 },
      { text: '나도 모른다. 그냥 거기까지 가야 직성이 풀린다', fuel: 'joy', intensity: 90 }
    ]
  },

  // === SECTION 2: 나를 움직이는 것 (Q5-8) ===
  {
    section: '나를 움직이는 것',
    text: '늦은 밤까지 잠을 줄여가며 무언가에 몰두하게 만드는 가장 강력한 힘은?',
    options: [
      { text: '맡은 일에 차질이 생기거나 누군가에게 폐를 끼치고 싶지 않은 마음', fuel: 'duty', intensity: 80 },
      { text: '뒤처지기 싫고, 나를 증명해 보이고 싶은 마음', fuel: 'ego', intensity: 80 },
      { text: '이 문제가 어떻게 풀리는지 끝까지 보고 싶은 호기심', fuel: 'joy', intensity: 80 },
      { text: '딱히 그렇게까지 몰두하는 일은 잘 없다', fuel: 'duty', intensity: 30 }
    ]
  },
  {
    section: '나를 움직이는 것',
    text: '아무도 보지 않는 일에 들이는 정성의 양은?',
    options: [
      { text: '보는 사람이 있을 때와 거의 같다. 내 기준이 따로 있다', fuel: 'joy', intensity: 90 },
      { text: '솔직히 줄어든다. 효율을 따지는 편이다', fuel: 'ego', intensity: 50 },
      { text: '오히려 더 신경 쓴다. 나중에 누가 봐도 부끄럽지 않아야 한다', fuel: 'duty', intensity: 85 },
      { text: '필요한 만큼만 한다. 과한 것도 부족한 것도 싫다', fuel: 'duty', intensity: 45 }
    ]
  },
  {
    section: '나를 움직이는 것',
    text: '당신이 어떤 일을 시작할 때 가장 먼저 떠올리는 것은?',
    options: [
      { text: '이 일이 누구에게 도움이 되고 누구에게 닿을지', fuel: 'duty', intensity: 70 },
      { text: '이 일을 통해 내가 어디까지 갈 수 있을지', fuel: 'ego', intensity: 75 },
      { text: '이 일이 얼마나 재미있을지, 무엇을 배울 수 있을지', fuel: 'joy', intensity: 75 },
      { text: '얼마나 걸리고 어떻게 끝낼지의 동선', fuel: 'duty', intensity: 55 }
    ]
  },

// ============ 상태 ============
let currentQ = 0;
let answers = new Array(questions.length).fill(null);

// ============ 진단 시작 ============
function startQuiz() {
  document.getElementById('intro').style.display = 'none';
  document.getElementById('quiz').classList.add('active');
  renderQuestion();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ============ 문항 렌더 ============
function renderQuestion() {
  const q = questions[currentQ];
  const container = document.getElementById('questionContainer');

  container.innerHTML = `
    <div class="question-block active">
      <div class="q-section">SECTION · ${q.section}</div>
      <div class="q-text">${q.text}</div>
      <div class="options">
        ${q.options.map((opt, i) => `
          <button class="option ${answers[currentQ] === i ? 'selected' : ''}"
                  onclick="selectOption(${i})">
            ${opt.text}
          </button>
        `).join('')}
      </div>
    </div>
  `;

  document.getElementById('progressNum').textContent = String(currentQ + 1).padStart(2, '0');
  document.getElementById('sectionLabel').textContent = q.section;
  document.getElementById('progressFill').style.width = `${((currentQ + 1) / questions.length) * 100}%`;
  document.getElementById('prevBtn').disabled = currentQ === 0;
  document.getElementById('nextBtn').disabled = answers[currentQ] === null;
  document.getElementById('nextBtn').textContent = currentQ === questions.length - 1 ? '결과 보기 →' : '다음 →';
}

function selectOption(idx) {
  answers[currentQ] = idx;
  renderQuestion();
}

function nextQuestion() {
  if (answers[currentQ] === null) return;
  if (currentQ === questions.length - 1) {
    showResult();
  } else {
    currentQ++;
    renderQuestion();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

function prevQuestion() {
  if (currentQ === 0) return;
  currentQ--;
  renderQuestion();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ============ 결과 계산 ============
function calculateResult() {
  const fuels = { ego: 0, duty: 0, joy: 0 };
  let intensitySum = 0;

  answers.forEach((ansIdx, qIdx) => {
    const opt = questions[qIdx].options[ansIdx];
    fuels[opt.fuel]++;
    intensitySum += opt.intensity;
  });

  const avgIntensity = intensitySum / questions.length;

  // 가장 높은 연료 결정
  const dominantFuel = Object.keys(fuels).reduce((a, b) => fuels[a] > fuels[b] ? a : b);
  const isIntense = avgIntensity >= 60;

  // 6유형 매핑
  let key;
  if (avgIntensity < 50) {
    // 잔잔함 영역
    if (dominantFuel === 'duty' && fuels.duty >= 5) key = 'silent_architect';
    else if (dominantFuel === 'joy') key = 'flowing_artisan';
    else key = 'peaceful_traveler';
  } else {
    // 치열함 영역
    if (dominantFuel === 'ego') key = 'conqueror';
    else if (dominantFuel === 'duty') key = 'guardian';
    else key = 'creator';
  }

  return {
    key,
    archetype: archetypes[key],
    fuels,
    intensity: avgIntensity,
    dominantFuel
  };
}

// ============ 결과 렌더 ============
function showResult() {
  document.getElementById('quiz').classList.remove('active');
  const resultEl = document.getElementById('result');
  resultEl.classList.add('active');

  const r = calculateResult();
  const a = r.archetype;

  // 좌표 계산: x축은 연료(ego=좌, joy=우), y축은 강도(아래=잔잔, 위=치열)
  const fuelScore = (r.fuels.joy - r.fuels.ego) / questions.length;
  const xPercent = 50 + fuelScore * 80; // -1~1 → 10~90%
  const yPercent = 100 - r.intensity; // 강도 높을수록 위로

  resultEl.innerHTML = `
    <div class="result-header">
      <div class="result-label">YOUR AMBITION SHAPE</div>
      <span class="result-emoji">${a.emoji}</span>
      <h2 class="result-title">${a.title}</h2>
      <p class="result-tagline">${a.tagline}</p>
    </div>

    <div class="axis-viz">
      <div class="axis-viz-label">당신의 야망 좌표</div>
      <div class="axis-grid">
        <span class="axis-label top">치열함</span>
        <span class="axis-label bottom">잔잔함</span>
        <span class="axis-label left">에고·책임</span>
        <span class="axis-label right">즐거움</span>
        <div class="axis-dot" style="left: ${xPercent}%; top: ${yPercent}%"></div>
      </div>
    </div>

    <div class="result-section">
      <div class="result-section-mark">01 · 당신의 모양</div>
      <h3 class="result-section-title">이 야망은 어떻게 생겼나</h3>
      <div class="result-section-body"><p>${a.shape}</p></div>
    </div>

    <div class="result-section">
      <div class="result-section-mark">02 · 강점</div>
      <h3 class="result-section-title">이 모양이 가진 힘</h3>
      <div class="result-section-body"><p>${a.strength}</p></div>
    </div>

    <div class="result-section">
      <div class="result-section-mark">03 · 그늘</div>
      <h3 class="result-section-title">조심해야 할 것</h3>
      <div class="result-section-body">
        <div class="shadow-box"><p>${a.shadow}</p></div>
      </div>
    </div>

    <div class="result-section">
      <div class="next-step">
        <div class="result-section-mark">04 · 다음 한 걸음</div>
        <h3 class="result-section-title" style="color: var(--bg)">지금 해볼 수 있는 것</h3>
        <div class="result-section-body"><p>${a.next}</p></div>
      </div>
    </div>

    <div class="result-section">
      <div class="result-section-mark">05 · 함께 읽으면 좋은 책</div>
      <h3 class="result-section-title">당신을 위한 한 권</h3>
      <div class="book-rec">
        <div class="book-icon">📖</div>
        <div class="book-content">
          <div class="book-title">${a.book.title}</div>
          <div class="book-author">${a.book.author}</div>
          <div class="book-reason">${a.book.reason}</div>
        </div>
      </div>
    </div>

    <div class="closing">
      <p class="closing-text">
        야망은 큰 사람과 없는 사람으로 나뉘지 않습니다.<br>
        어떤 결로 흐르는지가 다를 뿐입니다.<br>
        당신의 결을 알아본 오늘이, 다음 한 걸음의 시작입니다.
      </p>
      <div class="action-buttons">
        <button class="action-btn" onclick="restart()">다시 진단하기</button>
        <button class="action-btn primary" onclick="shareResult()">결과 공유하기</button>
      </div>
    </div>
  `;

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function restart() {
  currentQ = 0;
  answers = new Array(questions.length).fill(null);
  document.getElementById('result').classList.remove('active');
  document.getElementById('intro').style.display = 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function shareResult() {
  const r = calculateResult();
  const text = `나의 야망은 "${r.archetype.title}" — ${r.archetype.tagline}\n\n어바웃 프리덤 · 일상의 깨달음`;
  if (navigator.share) {
    navigator.share({ title: '야망의 모양 진단', text });
  } else {
    navigator.clipboard.writeText(text);
    alert('결과가 클립보드에 복사되었습니다');
  }
}
</script>
